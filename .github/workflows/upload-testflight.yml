name: Upload-to-TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "HTTPS URL of the signed .ipa"
        required: true

jobs:
  upload:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Fetch signed IPA
        run: |
          curl -sL --retry 3 -o ftv.ipa "${{ inputs.ipa_url }}"
          unzip -t ftv.ipa > /dev/null && echo "zip integrity OK"
          unzip -l ftv.ipa | grep "Payload/"

      - name: Show bundle identity
        run: |
          mkdir -p probe && cd probe
          unzip -qo ../ftv.ipa "Payload/*"
          APP=$(find . -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist"
          plutil -extract CFBundleVersion raw "$APP/Info.plist"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcrun altool --upload-app --file ftv.ipa \
            --type ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_SPEC_PW }}" \
            --team-id "6VS7BF6R33" 2>&1 | tee upload.log
          if grep -qiE "error|unable to" upload.log; then
            echo "::error::altool upload failed - see log above"
            exit 1
          fi
          echo "UPLOAD-DONE"